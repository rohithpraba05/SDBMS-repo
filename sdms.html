<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student DB Premium</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#222;
  --primary:#4f46e5;
  --accent:#22c55e;
  --danger:#ef4444;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e2e8f0;
}
body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{display:flex}
.sidebar{
  width:220px;
  background:#4f46e5;
  color:#fff;
  height:100vh;
  padding:20px;
}
.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}
.main{flex:1;padding:20px}
.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input,select{padding:8px;margin:5px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:center}
button.add{background:var(--accent);color:#fff;border:none;padding:8px;border-radius:5px}
button.delete{background:var(--danger);color:#fff;border:none;padding:6px 10px;border-radius:5px}
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#333;
  color:#fff;
  padding:10px 20px;
  border-radius:5px;
  opacity:0;
  transition:0.3s;
}
.toast.show{opacity:1}
</style>

</head>

<body>

<div id="loginPage" class="card" style="max-width:300px;margin:100px auto;text-align:center">
  <h2>Login</h2>
  <input id="username" placeholder="Username"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button class="add" onclick="login()">Login</button>
</div>

<div id="app" style="display:none">
<div class="container">

<div class="sidebar">
  <h2>Student DB</h2>
  <button onclick="showSection('dashboard')">Dashboard</button>
  <button onclick="showSection('students')">Students</button>
  <button onclick="toggleTheme()">Toggle Theme</button>
  <button onclick="exportCSV()">Export CSV</button>
  <input type="file" onchange="importCSV(event)">
  <button onclick="logout()">Logout</button>
</div>

<div class="main">

<div id="dashboard" class="section">
  <div class="card">
    <h3>Total Students: <span id="total">0</span></h3>
  </div>
  <div class="card">
    <canvas id="chart"></canvas>
  </div>
</div>

<div id="students" class="section" style="display:none">

<div class="card">
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="Phone">
  <select id="dept"><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option>
  <option>IT</option></select>
  <select id="year"><option>1</option><option>2</option><option>3</option><option>4</option></select>
  <button class="add" onclick="addStudent()">Add Student</button>
</div>

<div class="card">
  <input id="search" placeholder="Search" oninput="displayStudents()">
  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

</div>

</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
let students = JSON.parse(localStorage.getItem('students')) || [];
let chartInstance;

// TOAST
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}
// LOGIN
function login(){
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if(u==="admin" && p==="1234"){
    localStorage.setItem("login","true");
    init();
  } else showToast("Invalid Login");
}

function logout(){
  localStorage.removeItem("login");
  location.reload();
}

function init(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";
  displayStudents();
  updateDashboard();
}

if(localStorage.getItem("login")) init();

// NAVIGATION
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

// ADD STUDENT
function addStudent(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const dept = document.getElementById("dept").value;
  const year = document.getElementById("year").value;

  if(!name || !email) return showToast("Fill all fields");

  students.push({
    id: Date.now(),
    name, email, phone, dept, year
  });

  localStorage.setItem("students", JSON.stringify(students));
  showToast("Student Added");

  document.getElementById("name").value="";
  document.getElementById("email").value="";
  document.getElementById("phone").value="";

  displayStudents();
  updateDashboard();
}

// DISPLAY STUDENTS (FIXED)

function displayStudents(){
  const table = document.getElementById("table");
  const search = document.getElementById("search").value.toLowerCase();

  table.innerHTML = "";

  students
    .filter(s => (s.name || "").toLowerCase().includes(search))
    .forEach(s => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${s.name || "N/A"}</td>
        <td>${s.email || "N/A"}</td>
        <td>
          <button class="delete" onclick="del(${s.id})">Delete</button>
        </td>
      `;
      table.appendChild(row);
    });
}

// DELETE
function del(id){
  students = students.filter(s=>s.id!==id);
  localStorage.setItem("students", JSON.stringify(students));
  showToast("Deleted");
  displayStudents();
  updateDashboard();
}

// DASHBOARD
function updateDashboard(){
  document.getElementById("total").innerText = students.length;

  let counts = {};

  students.forEach(s=>{
    const dept = s.dept || "Unknown"; 
    counts[dept] = (counts[dept] || 0) + 1;
  });

  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(
    document.getElementById("chart"),
    {
      type:"pie",
      data:{
        labels:Object.keys(counts),
        datasets:[{data:Object.values(counts)}]
      }
    }
  );
}

// THEME
function toggleTheme(){
  document.body.classList.toggle("dark");
}

// EXPORT
function exportCSV(){
  let csv="name,email\n";
  students.forEach(s=>csv+=`${s.name},${s.email}\n`);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="students.csv";
  a.click();
}

// IMPORT
function importCSV(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let rows = reader.result.split("\n").slice(1);

    rows.forEach(r=>{
      let [name,email] = r.split(",");

      if(name){
        students.push({
          id: Date.now()+Math.random(),
          name: name.trim(),
          email: (email || "").trim(),
          dept: "Unknown",   // 🔥 IMPORTANT
          year: "1"
        });
      }
    });

    localStorage.setItem("students", JSON.stringify(students));
    showToast("Imported");
    displayStudents();
    updateDashboard();
  };

  reader.readAsText(file);
}
</script>

</body>
</html>
